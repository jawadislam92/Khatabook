name: duebook
description: Family ledger and field service app.
publish_to: "none"
version: 1.1.1+3

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^3.0.0
  go_router: ^17.0.0
  supabase_flutter: ^2.9.0
  http: ^1.2.0
  flutter_secure_storage: ^9.2.4
  local_auth: ^2.3.0
  shared_preferences: ^2.5.0
  crypto: ^3.0.6
  app_links: ^6.4.0
  url_launcher: ^6.3.0
  pdf: ^3.11.0
  printing: ^5.13.0
  share_plus: ^11.0.0
  path_provider: ^2.1.0
  uuid: ^4.5.0
  characters: ^1.4.0
  firebase_core: ^4.0.0
  firebase_messaging: ^16.0.0
  flutter_contacts: ^2.6.0
  file_picker: ^10.3.0
  google_sign_in: ^7.2.0
  package_info_plus: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/fonts/OFL.txt
    - assets/fonts/Roboto-Regular.ttf
    - assets/fonts/Roboto-Bold.ttf
    - assets/fonts/NotoNaskhArabic-Regular.ttf
    - assets/fonts/NotoNaskhArabic-Bold.ttf
  fonts:
    - family: NotoNastaliqUrdu
      fonts:
        - asset: assets/fonts/NotoNastaliqUrdu-Regular.ttf
        - asset: assets/fonts/NotoNastaliqUrdu-Bold.ttf
          weight: 700
