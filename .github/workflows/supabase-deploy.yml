name: Deploy database and functions

# Applies migrations and deploys Edge Functions.
# main  -> development project (every push)
# tags  -> production project (every v* tag, after the release build)
on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "dev or prod"
        required: true
        default: "dev"

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: ${{ (startsWith(github.ref, 'refs/tags/') || inputs.target == 'prod') && 'production' || 'development' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad5ef7cc4e2aa4b8 # v4.2.2
      - uses: supabase/setup-cli@b1fa3b11bb6ddd4a8f2e5fc6bd4d6fd5a9a7e0df # v1.5.0
        with:
          version: latest
      - name: Pick project
        id: pick
        run: |
          if [ "${{ startsWith(github.ref, 'refs/tags/') || inputs.target == 'prod' }}" = "true" ]; then
            echo "ref=${{ secrets.SUPABASE_PROJECT_REF_PROD }}" >> "$GITHUB_OUTPUT"
            echo "pw=${{ secrets.SUPABASE_DB_PASSWORD_PROD }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ secrets.SUPABASE_PROJECT_REF_DEV }}" >> "$GITHUB_OUTPUT"
            echo "pw=${{ secrets.SUPABASE_DB_PASSWORD_DEV }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Link and push migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ steps.pick.outputs.pw }}
        run: |
          supabase link --project-ref "${{ steps.pick.outputs.ref }}"
          supabase db push
      - name: Deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -n "$(ls -A supabase/functions 2>/dev/null)" ]; then
            supabase functions deploy --project-ref "${{ steps.pick.outputs.ref }}"
          else
            echo "No functions yet"
          fi
