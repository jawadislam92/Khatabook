name: Release build

# Runs when a version tag is pushed, for example v0.1.0.
# Produces a signed APK (for direct install on test phones) and a signed App Bundle (for Play Console).
on:
  push:
    tags: ["v*"]

jobs:
  android:
    name: Signed Android build
    runs-on: ubuntu-24.04
    environment: production
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true
      - name: Restore signing key and Firebase config from secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json; fi
          cat > android/key.properties <<PROPS
          storeFile=upload-keystore.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          PROPS
      - run: flutter pub get
      - run: flutter gen-l10n
      - name: Version from tag
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          echo "name=$TAG" >> "$GITHUB_OUTPUT"
          echo "code=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
      - name: Build APK and App Bundle
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL_PROD }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY_PROD }}
        run: |
          FIREBASE=false; [ -f android/app/google-services.json ] && FIREBASE=true
          COMMON="--release --build-name=${{ steps.ver.outputs.name }} --build-number=${{ steps.ver.outputs.code }} --dart-define=SUPABASE_URL=$SUPABASE_URL --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY --dart-define=FIREBASE_ENABLED=$FIREBASE --obfuscate --split-debug-info=build/symbols"
          flutter build apk $COMMON
          flutter build appbundle $COMMON
      - name: Remove key material
        if: always()
        run: rm -f android/app/upload-keystore.jks android/key.properties
      - uses: actions/upload-artifact@v4
        with:
          name: khatabook-${{ steps.ver.outputs.name }}
          path: |
            app/build/app/outputs/flutter-apk/app-release.apk
            app/build/app/outputs/bundle/release/app-release.aab
            app/build/symbols
          retention-days: 90
