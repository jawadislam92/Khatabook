# Manual check that every secret the pipeline needs is present and usable.
# Prints only "set" or "MISSING" per secret, and whether the keystore and
# Firebase config decode. Never prints a value.
name: Check secrets

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Presence
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          SUPABASE_URL_PROD: ${{ secrets.SUPABASE_URL_PROD }}
          SUPABASE_ANON_KEY_PROD: ${{ secrets.SUPABASE_ANON_KEY_PROD }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF_DEV: ${{ secrets.SUPABASE_PROJECT_REF_DEV }}
          SUPABASE_PROJECT_REF_PROD: ${{ secrets.SUPABASE_PROJECT_REF_PROD }}
          SUPABASE_DB_PASSWORD_DEV: ${{ secrets.SUPABASE_DB_PASSWORD_DEV }}
          SUPABASE_DB_PASSWORD_PROD: ${{ secrets.SUPABASE_DB_PASSWORD_PROD }}
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD \
                      GOOGLE_SERVICES_JSON SUPABASE_URL_PROD SUPABASE_ANON_KEY_PROD SUPABASE_ACCESS_TOKEN \
                      SUPABASE_PROJECT_REF_DEV SUPABASE_PROJECT_REF_PROD SUPABASE_DB_PASSWORD_DEV SUPABASE_DB_PASSWORD_PROD; do
            if [ -n "${!name}" ]; then echo "$name: set"; else echo "$name: MISSING"; missing=1; fi
          done
          echo "::group::Keystore"
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > /tmp/upload.jks 2>/dev/null && echo "keystore decodes: yes ($(stat -c %s /tmp/upload.jks) bytes)" || { echo "keystore decodes: NO"; missing=1; }
            if keytool -list -keystore /tmp/upload.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/tmp/kt.txt 2>&1; then
              echo "keystore password and alias: OK"
              grep -o "Certificate fingerprint (SHA-256): .*" /tmp/kt.txt || true
            else
              echo "keystore password or alias: FAILED"; missing=1
            fi
            rm -f /tmp/upload.jks
          fi
          echo "::endgroup::"
          echo "::group::Firebase config"
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            if echo "$GOOGLE_SERVICES_JSON" | python3 -c 'import json,sys; d=json.load(sys.stdin); pk=[c["client_info"]["android_client_info"]["package_name"] for c in d["client"]]; print("google-services.json parses: yes"); print("packages:", pk); sys.exit(0 if "com.sparkingasia.duebook" in pk else 1)'; then
              echo "contains com.sparkingasia.duebook: yes"
            else
              echo "google-services.json: invalid or missing com.sparkingasia.duebook"; missing=1
            fi
          fi
          echo "::endgroup::"
          echo "::group::Supabase values look right"
          [ "$SUPABASE_URL_PROD" = "https://ohrnkvzemgfrxcuknamh.supabase.co" ] && echo "SUPABASE_URL_PROD: matches prod" || { echo "SUPABASE_URL_PROD: does not match https://ohrnkvzemgfrxcuknamh.supabase.co"; missing=1; }
          [ "$SUPABASE_PROJECT_REF_PROD" = "ohrnkvzemgfrxcuknamh" ] && echo "SUPABASE_PROJECT_REF_PROD: ok" || { echo "SUPABASE_PROJECT_REF_PROD: expected ohrnkvzemgfrxcuknamh"; missing=1; }
          [ "$SUPABASE_PROJECT_REF_DEV" = "jepcsftdjejjzhfjnavy" ] && echo "SUPABASE_PROJECT_REF_DEV: ok" || { echo "SUPABASE_PROJECT_REF_DEV: expected jepcsftdjejjzhfjnavy"; missing=1; }
          case "$SUPABASE_ANON_KEY_PROD" in sb_publishable_*) echo "SUPABASE_ANON_KEY_PROD: publishable key format";; *) echo "SUPABASE_ANON_KEY_PROD: unexpected format"; missing=1;; esac
          echo "::endgroup::"
          exit $missing
