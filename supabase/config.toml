# Supabase CLI project config. Only the parts we rely on; the rest keep CLI defaults.
project_id = "khatabook"

[db]
major_version = 16

[auth]
site_url = "com.sparkingasia.duebook://login-callback"
additional_redirect_urls = ["com.sparkingasia.duebook://login-callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
minimum_password_length = 6
password_requirements = ""

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true

[auth.rate_limit]
email_sent = 4
sign_in_sign_ups = 30
token_verifications = 30

# Both functions are called by pg_cron with the x-cron-secret header and no
# user token, so the gateway must not demand a JWT. The functions refuse
# every request that lacks the secret.
[functions.run_due_notifications]
verify_jwt = false

[functions.backup_to_s3]
verify_jwt = false
