# Supabase CLI project config. Only the parts we rely on; the rest keep CLI defaults.
project_id = "khatabook"

[db]
major_version = 16

[auth]
site_url = "com.sparkingasia.duebook://login-callback"
additional_redirect_urls = ["com.sparkingasia.duebook://login-callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
minimum_password_length = 10
password_requirements = "lower_upper_letters_digits"

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true

[auth.rate_limit]
email_sent = 4
sign_in_sign_ups = 30
token_verifications = 30
